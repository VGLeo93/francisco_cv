name: Validate CV changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test tools
        run: npm ci
      - name: Export printable CV
        run: npm run build:pdf
      - name: Check CV
        run: npm run test:ui
      - name: Check site packaging
        run: npm run build
